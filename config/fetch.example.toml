# Example of config/fetch.toml.
#
# install.ps1 (or `python -m fetch_app init`) creates the real file with freshly
# generated secrets; you normally never write it by hand. Keep the real file
# private: secret_key encrypts the provider credentials stored in the database.
#
# Every value can also be given as an environment variable (FETCH_PORT,
# FETCH_LOG_LEVEL, ...). See docs/CONFIGURATION.md.

[paths]
# Relative paths are resolved against the FETCH folder.
data_dir = "data"
log_dir = "logs"
storage_root = "storage"

[server]
# FETCH always listens on 127.0.0.1 (this computer only).
# The port is used until it is changed in Settings > Advanced.
port = 8787
log_level = "INFO"

[updates]
# GitHub repository whose releases are offered in Settings > Updates and
# installed by update.ps1. Set to "" to turn update checks off.
repository = "tacobellerontop-sudo/f3tch"

[security]
# A Fernet key. Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
secret_key = "REPLACE-WITH-A-GENERATED-KEY"
# Hosts or CIDR ranges that downloads may reach although they are private
# addresses, e.g. ["192.168.1.20", "10.0.0.0/24"]. Leave empty unless needed.
ssrf_allowlist = []
