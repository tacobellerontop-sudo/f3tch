name: Release

# Pushing a tag like v1.2.3 tests the code, builds FETCH-1.2.3.zip and
# publishes it as a GitHub release. The tag must match the version in
# backend/fetch_app/__init__.py.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fetch-package
          path: dist
      - name: Check the tag against the version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/fetch_app/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          test -f "dist/FETCH-$version.zip"
          (cd dist && sha256sum -c "FETCH-$version.zip.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/FETCH-$version.zip" "dist/FETCH-$version.zip.sha256" \
            --title "FETCH $version" --notes-file notes.md --verify-tag

  verify:
    name: Update from the published release on Windows
    needs: publish
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fetch-package
          path: package
      - name: Install the package
        run: |
          $zip = Get-ChildItem package -Filter 'FETCH-*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath C:\fetch-test
          Set-Location C:\fetch-test\FETCH
          .\install.ps1 -Yes -SkipAria2
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          .\start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 exited with $LASTEXITCODE" }
      - name: Download, verify and reinstall the release with update.ps1
        working-directory: C:\fetch-test\FETCH
        run: |
          .\update.ps1 -Force -Unattended
          if ($LASTEXITCODE -ne 0) { throw "update.ps1 exited with $LASTEXITCODE" }
          $status = Get-Content data\update-status.json -Raw | ConvertFrom-Json
          if ($status.state -ne 'succeeded') { throw "Update state is $($status.state): $($status.message)" }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/api/health' -UseBasicParsing
          if ($health.status -ne 'ok') { throw 'FETCH did not come back after the update.' }
          .\stop.ps1
